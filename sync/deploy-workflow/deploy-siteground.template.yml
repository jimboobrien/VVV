# Auto-deploy to SiteGround (shared by pegasus, pegasus-child and every pegasus-* plugin repo).
# GENERATED by vagrant-local/sync/build-deploy-registry.py from deploy-workflow/deploy-siteground.template.yml - do not edit by hand.
# Registry: .github/deploy/sites.json (vendored in each repo; pegasus-child reads it from master).
# Docs: vagrant-local/DEPLOY-SITEGROUND.md
name: Deploy to SiteGround

on:
  push:
    branches:
#BRANCHES#
  workflow_dispatch:
    inputs:
      only_site:
        description: "Optional: deploy only this registry key (e.g. mabellas)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: siteground-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan deploy targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Check out registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # pegasus-child: registry always comes from the repo default branch (master or main); other repos: the pushed commit
          ref: ${{ github.event.repository.name == 'pegasus-child' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: .github/deploy
          persist-credentials: false
      - name: Build and validate site matrix
        id: plan
        env:
          REPO: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ONLY_SITE: ${{ github.event.inputs.only_site }}
        run: |
          set -euo pipefail
          none() { echo "::notice title=SiteGround deploy skipped::$1"; echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; echo "count=0" >> "$GITHUB_OUTPUT"; echo "Skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          REG=.github/deploy/sites.json
          [ -f "$REG" ] || none "registry $REG not found"
          if [ "$REPO" = "pegasus-child" ]; then
            [ "$REF" != "$DEFAULT_BRANCH" ] || none "push to $DEFAULT_BRANCH deploys nothing (site branches only)."
          else
            [ "$REF" = "$DEFAULT_BRANCH" ] || none "push to $REF (not $DEFAULT_BRANCH); only the default branch deploys."
          fi
          jq -c --arg repo "$REPO" --arg ref "$REF" --arg only "$ONLY_SITE" --arg child "pegasus-child" --arg default "$DEFAULT_BRANCH" '
            .components[$repo] as $c
            | [ .sites | to_entries[]
                | select(if $repo == $child then .value.child_branch == $ref
                         else ($repo == "pegasus") or (.value.plugins == null) or ((.value.plugins // []) | index($repo) != null) end)
                | select($only == "" or .key == $only)
                | {key: .key, environment: (.value.environment // "live"), enabled: .value.enabled,
                   host: .value.ssh_host, user: .value.ssh_user, port: ((.value.ssh_port // 18765) | tostring),
                   wp_content: .value.wp_content, kind: ($c.type // "plugin"),
                   folders: (($c.folders // [$repo]) | join(" ")),
                   fingerprint: (.value.ssh_fingerprint // ""),
                   branch: (if $repo == $child then $ref else $default end)} ]' "$REG" > all.json
          # Drop disabled entries and anything that fails strict validation before it reaches the matrix.
          jq -c '
            def ok: (.key | test("^[A-Za-z0-9._-]+$"))
              and (.host | test("^[A-Za-z0-9.-]+$")) and (.user | test("^[A-Za-z0-9._-]+$"))
              and (.port | test("^[0-9]{1,5}$")) and (.branch | test("^[A-Za-z0-9._/-]+$"))
              and (.wp_content | test("^/home/[A-Za-z0-9._-]+/www/[A-Za-z0-9.-]+/public_html(/[A-Za-z0-9._-]+)*/wp-content$"))
              and (.kind == "theme" or .kind == "plugin")
              and (.environment == "live" or .environment == "staging")
              and ((.folders | split(" ")) | all(test("^[A-Za-z0-9._-]+$")));
            def pinned: (.fingerprint | test("^SHA256:[A-Za-z0-9+/]{43}=?$"));
            {include: [.[] | select(.enabled == true) | select(ok) | select(pinned)]}' all.json > m.json
          jq -r '.[] | select(.enabled != true) | "::notice title=Skipped \(.key)::no SSH host/user/path in registry"' all.json
          jq -r --slurpfile m m.json '.[] | select(.enabled == true) | select(.fingerprint | test("^SHA256:[A-Za-z0-9+/]{43}=?$")) | .key as $k | select(([$m[0].include[].key] | index($k)) == null) | "::warning title=Invalid registry entry \(.key)::dropped: a field failed validation"' all.json
          # Host key pinning: never connect to a host without a valid pinned SHA256 fingerprint (ssh_fingerprint in the registry).
          jq -r '.[] | select(.enabled == true) | select((.fingerprint | test("^SHA256:[A-Za-z0-9+/]{43}=?$")) | not) | "::notice title=Skipped \(.key)::no pinned SSH host key fingerprint in registry (see DEPLOY-SITEGROUND.md)"' all.json
          n=$(jq '.include | length' m.json)
          [ "$n" -gt 0 ] || none "no valid registry sites map to $REPO@$REF."
          echo "matrix=$(cat m.json)" >> "$GITHUB_OUTPUT"; echo "count=$n" >> "$GITHUB_OUTPUT"
          { echo "### Deploy plan for $REPO@$REF"; jq -r '.include[] | "- \(.key) (\(.environment))"' m.json; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: ${{ matrix.key }} (${{ matrix.environment }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          HAS_KEY: ${{ secrets.SITEGROUND_SSH_KEY != '' }}
          M_HOST: ${{ matrix.host }}
          M_USER: ${{ matrix.user }}
          M_PATH: ${{ matrix.wp_content }}
        run: |
          # Mask host/user/path so they don't appear in the public log (incl. the ssh step's with:/env: header).
          for v in "$M_HOST" "$M_USER" "$M_PATH"; do echo "::add-mask::$v"; done
          if [ "$HAS_KEY" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=SiteGround deploy skipped::SITEGROUND_SSH_KEY is not available to this repo (org secret not shared with it?)"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: git pull --ff-only on server
        if: steps.secrets.outputs.ok == 'true'
        # v1.2.5: echoes the script only when debug is on (v1.0.3 always printed it); fingerprint = SHA256 host key pin
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SITE: ${{ matrix.key }}
          DEPLOY_WP_CONTENT: ${{ matrix.wp_content }}
          DEPLOY_KIND: ${{ matrix.kind }}
          DEPLOY_FOLDERS: ${{ matrix.folders }}
          DEPLOY_BRANCH: ${{ matrix.branch }}
          DEPLOY_REPO: ${{ github.event.repository.name }}
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.user }}
          key: ${{ secrets.SITEGROUND_SSH_KEY }}
          passphrase: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          port: ${{ secrets.SITEGROUND_SSH_PORT || matrix.port }}
          fingerprint: ${{ matrix.fingerprint }}
          debug: false
          envs: DEPLOY_SITE,DEPLOY_WP_CONTENT,DEPLOY_KIND,DEPLOY_FOLDERS,DEPLOY_BRANCH,DEPLOY_REPO
          script: |
            #DEPLOY_SCRIPT#
